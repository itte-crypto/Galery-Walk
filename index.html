<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery Walk – Grade 3 Posters</title>
<style>
:root{--bg:#fff8ec;--ink:#2b2b3a;--card:#fff;--c1:#ff8a5b;--c2:#ffc93c;--c3:#4cc9a0;--c4:#5b8def;--c5:#b57edc}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--c4);color:#fff}
h1{margin:0;font-size:1.4rem}
select,button{font:inherit;border-radius:12px;border:2px solid transparent;padding:8px 12px;cursor:pointer}
#bar{display:flex;gap:8px;align-items:center}
main{padding:20px;max-width:1100px;margin:auto}
#hint{background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:16px;border:2px dashed var(--c2)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;padding:16px;border-top:10px solid var(--c1);box-shadow:0 3px 8px #0002;cursor:pointer;text-align:left}
.card:nth-child(5n+2){border-color:var(--c2)}.card:nth-child(5n+3){border-color:var(--c3)}.card:nth-child(5n+4){border-color:var(--c4)}.card:nth-child(5n){border-color:var(--c5)}
.card b{display:block;font-size:1.1rem}.card small{color:#666}
.done{color:#168a63;font-weight:bold}
#modal{position:fixed;inset:0;background:#000a;display:none;overflow:auto;padding:12px}
#box{background:#fff;border-radius:18px;max-width:900px;margin:auto;padding:16px}
iframe{width:100%;aspect-ratio:16/10;border:0;border-radius:12px;background:#eee}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{background:#fff;border:2px solid var(--c3);padding:8px 12px}
.chip.on{background:var(--c3);color:#fff}
.chip.w{border-color:var(--c2)}.chip.w.on{background:var(--c2);color:var(--ink)}
.stars button{font-size:2rem;background:none;padding:0 4px;filter:grayscale(1);opacity:.5}
.stars button.on{filter:none;opacity:1}
.primary{background:var(--c1);color:#fff;font-weight:bold}
.ghost{background:#eee}
.fb{background:#f6f6ff;border-radius:12px;padding:8px 12px;margin:6px 0}
#msg{margin:8px 0;font-weight:bold}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div id="bar">
    <select id="who"></select>
    <button id="lang" class="ghost">EN / ID</button>
  </div>
</header>
<main>
  <div id="hint"></div>
  <div id="grid"></div>
</main>
<div id="modal"><div id="box"></div></div>

<script>
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwWTizKdlUln341WXAAw1V0etfz5-UcOAOc3BZyO78mhvh8EsPxCA6SVeIISSF-Px7z/exec', // URL Web App dari Apps Script
  MAX_PER_STUDENT: 3,   // tiap anak memberi feedback ke maksimal ... poster
  MAX_COMPLIMENTS: 2,   // maksimal bintang-hal-bagus yang dipilih
  ALLOW_NOTE: false     // true = anak boleh menulis kalimat sendiri
};
const C = {
  c1: {en: 'I love the colors!', id: 'Aku suka warna posternya!'},
  c2: {en: 'The pictures caught my eye.', id: 'Gambarnya menarik perhatianku.'},
  c3: {en: 'The words are easy to read.', id: 'Tulisannya mudah dibaca.'},
  c4: {en: 'The message is clear.', id: 'Pesan posternya jelas.'},
  c5: {en: 'It looks neat and creative.', id: 'Posternya rapi dan kreatif.'}
};
const W = {
  w1: {en: 'Maybe add more pictures.', id: 'Mungkin bisa ditambah gambar lagi.'},
  w2: {en: 'Maybe make the words bigger.', id: 'Mungkin tulisannya bisa dibuat lebih besar.'},
  w3: {en: 'Maybe use colors that stand out more.', id: 'Mungkin warnanya bisa lebih kontras.'},
  w4: {en: 'Maybe add more information.', id: 'Mungkin bisa ditambah informasi.'}
};
const T = {
  en: {title: 'Gallery Walk', pick: 'Who are you?', hint: 'Pick your name, then tap a poster. Give ⭐ stars, choose two things you like and one wish.', stars: 'How many stars?', like: 'Two stars: what I like', wish: 'A wish: what could be better', note: 'My own words (optional)', send: 'Send feedback', close: 'Close', open: 'Open in Canva', mine: 'My poster – feedback I got', none: 'No feedback yet.', sent: 'Thank you! Feedback sent. ✅', given: 'You already gave feedback ✅', limit: 'You have reached the limit of posters. Great job!', need: 'Please give stars and choose at least one thing.', err: 'Could not send. Try again.', cnt: 'feedback', soon: 'Poster is not ready yet.', load: 'Loading…'},
  id: {title: 'Gallery Walk', pick: 'Kamu siapa?', hint: 'Pilih namamu, lalu klik poster. Beri ⭐ bintang, pilih dua hal yang kamu suka dan satu harapan.', stars: 'Berapa bintang?', like: 'Dua bintang: yang aku suka', wish: 'Satu harapan: supaya lebih baik', note: 'Kalimatku sendiri (boleh dikosongkan)', send: 'Kirim feedback', close: 'Tutup', open: 'Buka di Canva', mine: 'Posterku – feedback yang masuk', none: 'Belum ada feedback.', sent: 'Terima kasih! Feedback terkirim. ✅', given: 'Kamu sudah memberi feedback ✅', limit: 'Kamu sudah mencapai batas jumlah poster. Hebat!', need: 'Beri bintang dan pilih minimal satu hal ya.', err: 'Gagal mengirim. Coba lagi.', cnt: 'feedback', soon: 'Poster belum siap.', load: 'Memuat…'}
};
let lang = 'id', me = localStorage.getItem('gw_me') || '', posters = [], fb = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t = k => T[lang][k];

function embedUrl(u) {
  u = String(u || '').split('?')[0].replace(/\/(edit|watch)$/, '/view');
  return /canva\.com\/design\//.test(u) ? u + '?embed' : '';
}
function names() { return posters.map(p => String(p.nama)).sort((a, b) => a.localeCompare(b)); }
function given() { return new Set(fb.filter(f => String(f.from) === me).map(f => String(f.posterId))); }
function renderText(f) {
  const parts = String(f.compliments || '').split(',').filter(Boolean).map(k => '⭐ ' + (C[k] ? C[k][lang] : ''));
  if (f.wish && W[f.wish]) parts.push('🌠 ' + W[f.wish][lang]);
  if (f.note) parts.push('💬 ' + esc(f.note));
  return '<div class="fb">' + '★'.repeat(Number(f.stars) || 0) + '<br>' + parts.join('<br>') + '</div>';
}
function render() {
  $('title').textContent = '🎨 ' + t('title');
  $('hint').textContent = t('hint');
  const sel = $('who');
  sel.innerHTML = '<option value="">' + esc(t('pick')) + '</option>' + names().map(n => '<option' + (n === me ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
  const g = given();
  $('grid').innerHTML = posters.map(p => {
    const n = fb.filter(f => String(f.posterId) === String(p.id)).length;
    return '<button class="card" data-id="' + esc(p.id) + '"><b>' + esc(p.nama) + '</b><small>' + esc(p.kelas || '') + '</small><br>' +
      (g.has(String(p.id)) ? '<span class="done">✅</span> ' : '') + '<small>' + n + ' ' + t('cnt') + '</small></button>';
  }).join('') || t('load');
}
let cur = null, st = {stars: 0, comp: [], wish: ''};
function openPoster(id) {
  cur = posters.find(p => String(p.id) === id); st = {stars: 0, comp: [], wish: ''};
  drawModal('');
  $('modal').style.display = 'block';
}
function drawModal(msg) {
  const p = cur, emb = embedUrl(p.canva_url), mine = String(p.nama) === me;
  const got = fb.filter(f => String(f.posterId) === String(p.id));
  let h = '<h2>' + esc(p.nama) + ' – ' + esc(p.kelas || '') + '</h2>' +
    (emb ? '<iframe src="' + esc(emb) + '" allowfullscreen loading="lazy"></iframe>' : '<p>' + t('soon') + '</p>') +
    '<p><a href="' + esc(p.canva_url) + '" target="_blank" rel="noopener">' + t('open') + '</a></p>';
  if (!me) h += '<p>👆 ' + t('pick') + '</p>';
  else if (mine) h += '<h3>' + t('mine') + '</h3>' + (got.map(renderText).join('') || '<p>' + t('none') + '</p>');
  else if (given().has(String(p.id))) h += '<p class="done">' + t('given') + '</p>';
  else if (given().size >= CONFIG.MAX_PER_STUDENT) h += '<p>' + t('limit') + '</p>';
  else {
    h += '<h3>' + t('stars') + '</h3><div class="stars">' + [1, 2, 3].map(n => '<button data-s="' + n + '" class="' + (st.stars >= n ? 'on' : '') + '">⭐</button>').join('') + '</div>' +
      '<h3>' + t('like') + '</h3><div class="chips">' + Object.keys(C).map(k => '<button class="chip' + (st.comp.includes(k) ? ' on' : '') + '" data-c="' + k + '">' + esc(C[k][lang]) + '</button>').join('') + '</div>' +
      '<h3>' + t('wish') + '</h3><div class="chips">' + Object.keys(W).map(k => '<button class="chip w' + (st.wish === k ? ' on' : '') + '" data-w="' + k + '">' + esc(W[k][lang]) + '</button>').join('') + '</div>' +
      (CONFIG.ALLOW_NOTE ? '<input id="note" maxlength="120" placeholder="' + esc(t('note')) + '" style="width:100%;padding:8px;margin-bottom:10px">' : '') +
      '<button class="primary" id="send">' + t('send') + '</button>';
  }
  h += '<div id="msg">' + esc(msg) + '</div><button class="ghost" id="close">' + t('close') + '</button>';
  $('box').innerHTML = h;
}
async function load() {
  try {
    const d = await (await fetch(CONFIG.SCRIPT_URL)).json();
    posters = d.posters; fb = d.feedback;
  } catch (e) { $('grid').textContent = 'Error: ' + e.message; return; }
  render();
}
$('who').onchange = e => { me = e.target.value; localStorage.setItem('gw_me', me); render(); };
$('lang').onclick = () => { lang = lang === 'id' ? 'en' : 'id'; render(); if ($('modal').style.display === 'block') drawModal(''); };
$('grid').onclick = e => { const c = e.target.closest('.card'); if (c) openPoster(c.dataset.id); };
$('box').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'close') { $('modal').style.display = 'none'; $('box').innerHTML = ''; return; }
  if (b.dataset.s) st.stars = +b.dataset.s;
  if (b.dataset.c) { const i = st.comp.indexOf(b.dataset.c); if (i > -1) st.comp.splice(i, 1); else if (st.comp.length < CONFIG.MAX_COMPLIMENTS) st.comp.push(b.dataset.c); }
  if (b.dataset.w) st.wish = st.wish === b.dataset.w ? '' : b.dataset.w;
  if (b.id === 'send') {
    if (!st.stars || (!st.comp.length && !st.wish)) return drawModal(t('need'));
    const body = {posterId: cur.id, from: me, stars: st.stars, compliments: st.comp.join(','), wish: st.wish, note: CONFIG.ALLOW_NOTE ? ($('note').value || '') : ''};
    b.disabled = true;
    try {
      await fetch(CONFIG.SCRIPT_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body)});
      fb.push(body); render(); return drawModal(t('sent'));
    } catch (err) { b.disabled = false; return drawModal(t('err')); }
  }
  drawModal('');
};
render(); load();
</script>
</body>
</html>
